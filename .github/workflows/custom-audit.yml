name: Publish audited IE-Voices-Pack 1.0
on:
  push:
    branches: [main]
    paths: ['.github/workflows/custom-audit.yml']
permissions:
  contents: write
concurrency:
  group: ie-voices-pack-release-1-0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate fixes and publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base=2ecd3d90fce897c7d78e5ac0d6dcd753264fdfd9
          test "$GITHUB_REPOSITORY" = Sauler89/IE-Voices-Pack
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          old_tag=40f6ee5991f8ac642dc8ada455654495a42140c4
          test "$(git rev-parse refs/tags/v1.0)" = "$old_tag"
          git merge-base --is-ancestor "$base" HEAD
          gh api "repos/$GITHUB_REPOSITORY/releases/405613067" > /tmp/release-before.json
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/release-before.json'))
          assert r['tag_name'] == 'v1.0' and not r['immutable']
          a = {a['name']: a for a in r['assets']}
          assert a['IE-Voices-Pack-v1.0.zip']['id'] == 619019272
          assert a['IE-Voices-Pack-v1.0.sha256']['id'] == 619020299
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('README.md');b=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='58bd132b5452835a6aa0aca52ad245b0a31c9779'
          for line in Path('MANIFEST-SHA256.txt').read_text().splitlines():
              digest,name=line.split('  ',1)
              if name!='README.md':assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          texts={'README.md': "# IE-Voices-Pack\n\n**Version 1.0** — 205 player voice sets in one WeiDU installer.\n\n## Contents\n\n| Voice pack | Sets |\n| --- | ---: |\n| Baldur's Gate | 18 |\n| Baldur's Gate II | 9 |\n| Baldur's Gate NPCs | 36 |\n| Icewind Dale / Heart of Winter | 30 |\n| Icewind Dale II | 12 |\n| Planescape: Torment | 8 |\n| Neverwinter Nights | 59 |\n| NWN2 / Mask of the Betrayer / Darkness over Daggerford | 16 |\n| Custom voice packs and their included portraits | 17 |\n| **Total** | **205** |\n\nThe 14 generic NWN2 soundsets are excluded.\n\n## Custom voice packs\n\nThis component currently includes these 17 packs:\n\n- Archmage\n- Amelyssan\n- Christopher Lee\n- Dagoth Ur\n- DotA 2: Invoker\n- DotA 2: Puck\n- Filthy Frank\n- Greta\n- Gromnir Il-Khan\n- Illasera\n- Morpheus\n- Palpatine\n- Rondak (lawful good)\n- Safana (Siege of Dragonspear)\n- Shang Tsung\n- The Hound\n- Thrall\n\n## Compatibility\n\n- Baldur's Gate: Enhanced Edition and Siege of Dragonspear\n- Baldur's Gate II: Enhanced Edition\n- Enhanced Edition Trilogy (EET)\n- Icewind Dale: Enhanced Edition\n\nRequires **EE 2.6.6+**. Classic games and Planescape: Torment: Enhanced Edition are not supported.\nFor Steam/GOG Siege of Dragonspear, run [DlcMerger](https://github.com/Argent77/A7-DlcMerger) first when required.\n\n## Installation\n\n1. Download the release ZIP and extract `IE-Voices-Pack/` and `setup-IE-Voices-Pack.exe` into the game folder containing `chitin.key`.\n2. Run `setup-IE-Voices-Pack.exe` and select the desired packs. The last component, **Custom voice packs and included portraits**, lets you install all 17 custom packs or answer yes/no for each pack. Its portraits follow your choices.\n3. Choose a voice during character creation or customization.\n\nThe installer and voices are in English. Uninstall an earlier version of this compilation before installing v1.0. Do not install the same voices from their original packs as well.\n\nCustom portraits include paired 24-bit BMP resources for the vanilla EE interface and Infinity UI++, with a standard-portrait fallback for the optional full-body inventory view. If you use Infinity UI++, install the custom component after the UI mod; reinstall that component if you replace the UI later.\n\n## Credits\n\nOriginal voice-pack conversions: **GraionDilach** and **AstroBryGuy / The Gate Project**.\nCompilation and integration: **Sauler89**.\n\nCustom packs are supplied by their original authors; available author details and source documentation are preserved in the package.\n\nSee [full credits](CREDITS.md) and [third-party notices](THIRD_PARTY.md). Original audio and text remain the property of their respective rights holders.\n", 'CHANGELOG.md': "# Changelog\n\n## 1.0\n\n- Initial IE-Voices-Pack release: 188 English player voice sets.\n- Eight selectable WeiDU components for EE 2.6.6+ and EET.\n- Omit seven legacy cues whose original audio files are absent; remove eight dangling audio references.\n- Add a final custom component with 17 supplied voice packs, all-at-once or individual selection.\n- Include all 11 supplied portrait variants, with adapted L/M/S BMPs and vanilla/Infinity UI++ registration.\n- Use unique sound/portrait names, active game-language placement and EE 2.6 event maps for BG:EE, BGII:EE, EET and IWD:EE.\n- Add standard-portrait fallback resources for Infinity UI++'s optional full-body inventory view.\n", 'IE-Voices-Pack/docs/CUSTOM_PACKS.md': "# Custom voice packs\n\nComponent **3000** is last. Choose **1** for all 17 packs or **2** to answer yes/no for each pack. Portraits are installed only with their selected voice pack. A selection of no packs rolls the component back without changes.\n\n| Pack | Mapped audio clips | Portrait variants |\n| --- | ---: | ---: |\n| Archmage | 29 | 0 |\n| Amelyssan | 17 | 0 |\n| Christopher Lee | 44 | 2 |\n| Dagoth Ur | 37 | 2 |\n| DotA 2: Invoker | 34 | 0 |\n| DotA 2: Puck | 33 | 0 |\n| Filthy Frank | 32 | 0 |\n| Greta | 26 | 0 |\n| Gromnir Il-Khan | 10 | 0 |\n| Illasera | 17 | 0 |\n| Morpheus | 41 | 2 |\n| Palpatine | 34 | 2 |\n| Rondak (lawful good) | 36 | 0 |\n| Safana (Siege of Dragonspear) | 43 | 0 |\n| Shang Tsung | 36 | 1 |\n| The Hound | 36 | 1 |\n| Thrall | 32 | 1 |\n\nAudio is packaged as mono PCM signed 16-bit WAV at 22,050 Hz, with unique resource names. Existing subtitles are retained. Packs supplied without subtitles have no invented dialogue text. Illasera's descriptive filenames are mapped conservatively to selection, command, combat, damage and death events; its second critical-miss recording is retained as an unassigned alternative.\n\nInvoker's missing BOB template entries and Puck's absent night recording are omitted. Rondak's two included rare-response clips are registered. EE 2.6's broken additional damage slots and `common7` remain unset; their supplied clips remain in the package. The curated Amelyssan and Gromnir selections stay sparse rather than being filled with unrelated source recordings.\n\nAll supplied portrait originals are preserved. Adapted 24-bit RGB BMPs use paired L/M/S names no longer than eight characters. R aliases retain the standard portrait as a fallback for Infinity UI++'s optional full-body inventory view; no new full-body artwork is invented. The M/S images retain at least 210×330 pixels to avoid enlarging legacy 54×84 thumbnails in Infinity UI++; large source art is retained at 420×660 where available. These portrait dimensions scale in the vanilla Enhanced Editions as well.\n\nThe portraits are added through a separate `M_ivport.lua` list. When Infinity UI++ is present, its start-screen refresh also restores this list without replacing its interface. Install the custom component after Infinity UI++; reinstall it if a later UI installation replaces `UI.MENU`.\n\n`PACKS.json` records the source archive SHA-256, each slot, original filename, subtitle and portrait resource. Original source installer files and available READMEs are preserved in `docs/custom-sources/`. No original installer executable is bundled; the compilation uses the single supplied WeiDU 249 installer.\n"}
          for name,text in texts.items():Path(name).write_text(text)
          count=0
          for p in Path('IE-Voices-Pack/sources/custom').glob('*/portraits/*L.bmp'):
              target=p.with_name(p.stem[:-1]+'R.bmp')
              assert not target.exists()
              target.write_bytes(p.read_bytes());count+=1
          assert count==11
          files=[p for p in Path('IE-Voices-Pack').rglob('*') if p.is_file()]
          files += [Path(n) for n in ['README.md','CHANGELOG.md','CREDITS.md','THIRD_PARTY.md','setup-IE-Voices-Pack.exe']]
          assert len(files)==7485
          Path('MANIFEST-SHA256.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.as_posix()+'\n' for p in sorted(files,key=lambda p:p.as_posix())))
          PY
          python3 - . /tmp/IE-Voices-Pack-v1.0-custom.zip <<'PY'
          from pathlib import Path
          import hashlib, json, struct, sys, zipfile
          
          root = Path(sys.argv[1])
          out = Path(sys.argv[2])
          docs = ['README.md', 'CHANGELOG.md', 'CREDITS.md', 'THIRD_PARTY.md', 'MANIFEST-SHA256.txt']
          files = [p for p in (root / 'IE-Voices-Pack').rglob('*') if p.is_file()]
          files += [root / n for n in docs + ['setup-IE-Voices-Pack.exe']]
          assert len(files) == 7486, len(files)
          source = {p.relative_to(root).as_posix(): p.read_bytes() for p in files}
          manifest = source['MANIFEST-SHA256.txt'].decode().splitlines()
          assert len(manifest) == 7485
          checked = set()
          for line in manifest:
              digest, name = line.split('  ', 1)
              assert name not in checked and name != 'MANIFEST-SHA256.txt'
              assert hashlib.sha256(source[name]).hexdigest() == digest, name
              checked.add(name)
          assert checked == set(source) - {'MANIFEST-SHA256.txt'}
          assert hashlib.sha256(source['setup-IE-Voices-Pack.exe']).hexdigest() == 'ad70f5897a6d0ba4b0d226f845a9b14cf345f56cc9697ca8d05cac9fe4932c1a'
          custom = 'IE-Voices-Pack/sources/custom/'
          audio = [n for n in source if n.startswith(custom) and n.lower().endswith('.wav')]
          portraits = [n for n in source if n.startswith(custom) and '/portraits/' in n and n.lower().endswith('.bmp')]
          assert len(audio) == 537 and len(portraits) == 44
          for name in portraits:
              b = source[name]
              assert b[:2] == b'BM' and struct.unpack_from('<H', b, 28)[0] == 24 and struct.unpack_from('<I', b, 30)[0] == 0
              assert len(Path(name).stem) <= 8
          tp2 = 'IE-Voices-Pack/IE-Voices-Pack.tp2'
          assert source[tp2].count(b'BEGIN @53000') == 1
          assert source[tp2].rfind(b'DESIGNATED 3000') > source[tp2].rfind(b'DESIGNATED 2100')
          assert b'VERSION ~1.0~' in source[tp2]
          assert source[tp2].count(b'README ~README.md~') == 1
          entries = {}
          for name, data in source.items():
              if name == 'MANIFEST-SHA256.txt':
                  continue
              target = 'IE-Voices-Pack/' + name if name in docs else name
              if name == tp2:
                  data = data.replace(b'README ~README.md~', b'README ~IE-Voices-Pack/README.md~')
              assert target not in entries
              entries[target] = data
          entries['IE-Voices-Pack/MANIFEST-SHA256.txt'] = ''.join(hashlib.sha256(data).hexdigest() + '  ' + name + '\n' for name, data in sorted(entries.items())).encode()
          assert len(entries) == 7486
          assert {n.split('/')[0] for n in entries} == {'IE-Voices-Pack', 'setup-IE-Voices-Pack.exe'}
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name, data in sorted(entries.items()):
                  info = zipfile.ZipInfo(name, (2026, 10, 7, 0, 0, 0))
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.compress_type = zipfile.ZIP_DEFLATED
                  z.writestr(info, data, compresslevel=9)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None
              assert set(z.namelist()) == set(entries)
              for name, data in entries.items():
                  assert z.read(name) == data, name
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          out.with_name('IE-Voices-Pack-v1.0.sha256').write_text(digest + '  IE-Voices-Pack-v1.0.zip\n')
          report = {'files': len(entries), 'bytes': out.stat().st_size, 'sha256': digest, 'custom_audio': len(audio), 'custom_portraits': len(portraits)}
          out.with_name('custom-package-report.json').write_text(json.dumps(report))
          print(json.dumps(report))
          
          PY
          git rm .github/workflows/custom-audit.yml
          git add README.md CHANGELOG.md IE-Voices-Pack/docs/CUSTOM_PACKS.md IE-Voices-Pack/sources/custom MANIFEST-SHA256.txt
          git config user.name Sauler89
          git config user.email Sauler89@users.noreply.github.com
          tree=$(git write-tree)
          test "$tree" = 2ebe790670860dc02fbfec6c91cd1e8deb90f300
          new=$(printf 'IE-Voices-Pack 1.0\n' | git commit-tree "$tree")
          test "$(git cat-file -p "$new" | sed -n '/^parent /p' | wc -l)" = 0
          gh release upload v1.0 /tmp/IE-Voices-Pack-v1.0-custom.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/405613067" > /tmp/release-staged.json
          python3 - <<'PY'
          import json
          r = json.load(open('/tmp/release-staged.json'))
          asset = next(a for a in r['assets'] if a['name'] == 'IE-Voices-Pack-v1.0-custom.zip')
          expected = json.load(open('/tmp/custom-package-report.json'))
          assert asset['state'] == 'uploaded' and asset['size'] == expected['bytes']
          assert asset['digest'] == 'sha256:' + expected['sha256']
          open('/tmp/staged-asset-id', 'w').write(str(asset['id']))
          PY
          git push --atomic --force-with-lease=refs/heads/main:"$GITHUB_SHA" --force-with-lease=refs/tags/v1.0:"$old_tag" origin "$new:refs/heads/main" "$new:refs/tags/v1.0"
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/619019272"
          staged_id=$(cat /tmp/staged-asset-id)
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staged_id" -f name=IE-Voices-Pack-v1.0.zip > /tmp/renamed-asset.json
          gh release upload v1.0 /tmp/IE-Voices-Pack-v1.0.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          if git ls-remote --exit-code --heads origin refs/heads/custom-audit-1-0 > /dev/null; then
              git push origin --delete custom-audit-1-0
          fi
          printf 'Published root commit: %s\n' "$new"
          cat /tmp/custom-package-report.json
