name: Audit IE-Voices-Pack release package

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit/package
          gh release download v1.1.0 --repo "${GITHUB_REPOSITORY}" --pattern 'IE-Voices-Pack-v1.1.0.zip' --dir audit
          unzip -q audit/IE-Voices-Pack-v1.1.0.zip -d audit/package

      - name: Build audit report
        shell: bash
        run: |
          {
            echo '=== TOP LEVEL ==='
            find audit/package -mindepth 1 -maxdepth 2 -printf '%P\n' | sort
            echo
            echo '=== FILE COUNTS ==='
            echo "Total files: $(find audit/package -type f | wc -l)"
            echo "WAV files: $(find audit/package -type f -iname '*.wav' | wc -l)"
            echo "TP2 files: $(find audit/package -type f -iname '*.tp2' | wc -l)"
            echo "TRA files: $(find audit/package -type f -iname '*.tra' | wc -l)"
            echo "EXE files: $(find audit/package -type f -iname '*.exe' | wc -l)"
            echo
            echo '=== TEXT / INSTALLER FILES ==='
            find audit/package -type f \( -iname '*.tp2' -o -iname '*.tra' -o -iname '*.ini' -o -iname '*.txt' -o -iname '*.md' -o -iname '*.lua' -o -iname '*.tpa' -o -iname '*.tph' -o -iname '*.json' \) -printf '%P\n' | sort
            echo
            echo '=== OLD PROJECT NAME REFERENCES ==='
            grep -RInE --include='*.tp2' --include='*.tra' --include='*.ini' --include='*.txt' --include='*.md' --include='*.lua' --include='*.tpa' --include='*.tph' --include='*.json'               'Infinity Engine All Voices|Infinity-Engine-All-Voices|Infinity Engine Voices Pack|Infinity-Engine-Voices-Pack' audit/package || true
            echo
            echo '=== LIKELY ITALIAN TEXT ==='
            grep -RInEi --include='*.tp2' --include='*.tra' --include='*.ini' --include='*.txt' --include='*.md' --include='*.lua' --include='*.tpa' --include='*.tph' --include='*.json'               'raccolta|compatibilit[aà]|contenuto|installazione|pacchett[oi]|vocal[ei]|gioch[io]|esclus[oi]|verifica del file|versione|seleziona|annulla|italian[oa]|ingles[ei]|personaggi nominati' audit/package || true
            echo
            echo '=== LANGUAGE DECLARATIONS ==='
            grep -RInE --include='*.tp2' '^[[:space:]]*LANGUAGE|^[[:space:]]*VERSION|^[[:space:]]*BEGIN' audit/package | head -n 400 || true
            echo
            echo '=== ARCHIVE SHA256 ==='
            sha256sum audit/IE-Voices-Pack-v1.1.0.zip
          } > audit/audit-report.txt

          cat audit/audit-report.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ie-voices-pack-audit
          path: audit/audit-report.txt
