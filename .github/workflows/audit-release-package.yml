name: Fix IE-Voices-Pack v1.2.0 release notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-release:
    if: github.event.head_commit.message == 'Fix IE-Voices-Pack v1.2.0 release notes'
    runs-on: ubuntu-latest
    steps:
      - name: Fix release description
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # IE-Voices-Pack

          **v1.2.0** is the public English-only maintenance release of IE-Voices-Pack.

          ## Highlights

          - 188 English player voice sets
          - English-only installer and documentation
          - Public project identity standardized as **IE-Voices-Pack**
          - Detailed original-author credits and third-party notices included
          - Internal WeiDU identifier `allvoices` retained for safe upgrade/uninstall compatibility
          - All 6,742 bundled WAV files preserved unchanged from v1.1.0

          ## Compatibility

          - Baldur's Gate: Enhanced Edition 2.6.6+
          - Baldur's Gate II: Enhanced Edition 2.6.6+
          - Enhanced Edition Trilogy (EET)
          - Icewind Dale: Enhanced Edition 2.6.6+

          ## Credits

          Original voice-pack conversion work: **GraionDilach** and **AstroBryGuy / The Gate Project**. See `CREDITS.md` and `THIRD_PARTY.md` in the repository and release package for full attribution.

          ## SHA-256

          `FB515A25772FDF8D2C088EEB307E1C4A06BB9D612B3D4CBF6BF62F9C084C9F08`
          EOF

          BODY="$(cat /tmp/release-notes.md)"
          jq -n --arg name 'IE-Voices-Pack' --arg body "$BODY" '{name:$name, body:$body}' |
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/405596411" --input -
