name: Inspect IE-Voices-Pack package paths

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit/package
          gh release download v1.1.0 --repo "${GITHUB_REPOSITORY}" --pattern 'IE-Voices-Pack-v1.1.0.zip' --dir audit
          unzip -q audit/IE-Voices-Pack-v1.1.0.zip -d audit/package

      - name: Inspect rename-sensitive content
        run: |
          echo '=== ALL ALLVOICES TEXT REFERENCES ==='
          grep -RIn --binary-files=without-match -i 'allvoices' audit/package/allvoices             --include='*.tp2' --include='*.tpa' --include='*.tph' --include='*.tra' --include='*.md' --include='*.txt' --include='*.ini' --include='*.lua' || true

          echo '=== TP2 ==='
          cat audit/package/allvoices/allvoices.tp2

          echo '=== ENGLISH SETUP.TRA ==='
          cat audit/package/allvoices/language/english/setup.tra

          echo '=== README ==='
          cat audit/package/allvoices/README.md

          echo '=== CHANGELOG ==='
          cat audit/package/allvoices/CHANGELOG.md

          echo '=== SOURCES ==='
          cat audit/package/allvoices/docs/SOURCES.md
